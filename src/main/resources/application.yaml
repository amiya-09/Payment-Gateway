spring:
  application:
    name: razorpay
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/razorpayDB}
    username: ${DB_USER:amiya}
    password: ${DB_PASS:password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    listener:
      ack-mode: manual
    bootstrap-servers: ${KAFKA_BROKERS:localhost:29092}
    consumer:
      group-id: razorpay-monolith
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.springboot.razorpay.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 3
        spring.json.add.type.headers: false

  threads:
    virtual:
      enabled: true

vault:
  master-key: Ua3qMvt9R6E6rfUYHD5wj72HooXHB6sjXIMmBzhk5pg=


# These are my configurations for simulator. You can change the values to test different scenarios.
payment:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: NORMAL
    method:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95
      NET_BANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 80

jwt:
  secret-key: dont-use-in-prod-a9t59bty5vtb59v986tv5b9wvb5a9bqvfaobvab576vbc7n4x38mz2n8mb69v

app:
  rate-limit:
    method: fixed
    use-case:
      api-key:
        requests-per-minute: 2
  kafka:
    topics:
      payment: payment.events
      order: order.events
      refund: refund.events
      settlement: settlement.events
  webhook:
    delivery:
      redis-key: "webhook-retry"
      poll-batch-size: 100















